name: dbt build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # the raw layer is in the repo, so the build does not depend on the SEC API
      - run: dbt build --profiles-dir .
